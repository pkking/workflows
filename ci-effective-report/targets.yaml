# gh_ci_report.py 默认采集目标。不传 --target / --config 时读此文件。
# 改这里即可调整「不输项目」时的默认集合；每仓可多个 workflow。
# 也可临时用 --target OWNER/REPO:WORKFLOW 覆盖，或 --config 指向别的文件。
# workflow 显示名需精确匹配 GitHub；名称含特殊字符时改用 OWNER/REPO@WORKFLOW_ID。

repositories:
  - repo: vllm-project/vllm-ascend
    workflows:
      - name: E2E
  - repo: sgl-project/sglang
    workflows:
      - name: PR Test (NPU)
