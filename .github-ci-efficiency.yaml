# GitHub Actions duration targets for NPU/GPU CI comparison.
# Workflow names are matched exactly, case-insensitively by the report skill.
# The configuration was checked against the repositories' Actions metadata on
# 2026-07-18. comparison_group identifies the project; comparison_name is only
# PR or Nightly, so NPU and GPU workflows at the same level are adjacent.
# Projects without a real GPU or nightly workflow only include available data.

defaults:
  min_e2e_minutes: 10

repositories:
  - repo: sgl-project/sglang
    comparison_group: sglang
    workflows:
      - name: PR Test (NPU)
        comparison_name: PR
      - name: PR Test Base
        comparison_name: PR
      - name: Nightly Test (NPU)
        comparison_name: Nightly
      - name: Nightly Test (Nvidia)
        comparison_name: Nightly

  - repo: verl-project/verl
    comparison_group: verl
    workflows:
      - name: e2e_ascend
        comparison_name: PR
      - name: e2e_ppo_trainer
        comparison_name: PR
      - name: nightly_ci_ascend
        comparison_name: Nightly
      - name: nightly_ci_ascend_multinode
        comparison_name: Nightly

  - repo: vllm-project/vllm-ascend
    comparison_group: vllm-ascend
    workflows:
      - name: E2E
        comparison_name: PR
      - name: Nightly
        comparison_name: Nightly
      - name: ascend test / nightly
        comparison_name: Nightly
      - name: Nightly-A2
        comparison_name: Nightly
      - name: Nightly-A3
        comparison_name: Nightly
      - name: E2E-upstream
        comparison_name: Nightly

  - repo: areal-project/AReaL
    comparison_group: areal-ascend
    workflows:
      - name: AReaL CI on GCP runner
        comparison_name: PR
      - name: Nightly CI
        comparison_name: Nightly

  - repo: alibaba/ROLL
    comparison_group: roll-ascend
    workflows:
      - name: MindSpeed NPU Tests
        comparison_name: PR

  - repo: triton-lang/triton
    comparison_group: triton
    workflows:
      - name: Integration Tests
        comparison_name: PR
      - name: Wheels
        comparison_name: Nightly

  - repo: triton-lang/triton-ascend
    comparison_group: triton
    workflows:
      # This PR workflow calls the reusable "Integration Tests NPU" workflow.
      - name: Integration Tests
        comparison_name: PR
      - name: Wheels
        comparison_name: Nightly

  - repo: tile-ai/tilelang
    comparison_group: tilelang
    workflows:
      - name: CI
        comparison_name: PR

  - repo: tile-ai/tilelang-mlir-ascend
    comparison_group: tilelang
    workflows:
      # Base CI is the current PR entrypoint for the Ascend/NPU-IR checks.
      - name: Base CI
        comparison_name: PR

  - repo: modelscope/ms-swift
    comparison_group: ms-swift-ascend
    workflows:
      - name: citest-npu
        comparison_name: PR
      - name: citest
        comparison_name: PR

  - repo: hiyouga/LLaMA-Factory
    comparison_group: llamafactory-ascend
    workflows:
      - name: tests_npu
        comparison_name: PR
      - name: tests_cuda
        comparison_name: PR
