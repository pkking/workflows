# GitHub Actions duration targets for Ascend/NPU CI.
# Workflow names are matched exactly, case-insensitively by the report skill.
# The configuration was checked against the repositories' Actions metadata on
# 2026-07-18. Projects without a dedicated nightly workflow are represented by
# their real PR/push-triggered NPU workflow only.

defaults:
  min_e2e_minutes: 10

repositories:
  - repo: sgl-project/sglang
    comparison_group: sglang-ascend
    workflows:
      - name: PR Test (NPU)
        comparison_name: PR / NPU
      - name: Nightly Test (NPU)
        comparison_name: Nightly / NPU

  - repo: verl-project/verl
    comparison_group: verl-ascend
    workflows:
      - name: e2e_ascend
        comparison_name: PR / Ascend E2E
      - name: nightly_ci_ascend
        comparison_name: Nightly / Ascend
      - name: nightly_ci_ascend_multinode
        comparison_name: Nightly / Ascend multinode

  - repo: vllm-project/vllm-ascend
    comparison_group: vllm-ascend
    workflows:
      - name: E2E
        comparison_name: PR / E2E
      - name: Nightly
        comparison_name: Nightly
      - name: Nightly-A2
        comparison_name: Nightly / A2
      - name: Nightly-A3
        comparison_name: Nightly / A3

  - repo: inclusionAI/AReaL
    comparison_group: areal-ascend
    workflows:
      - name: AReaL CI on GCP runner
        comparison_name: PR / Ascend-capable CI
      - name: Nightly CI
        comparison_name: Nightly

  - repo: alibaba/ROLL
    comparison_group: roll-ascend
    workflows:
      - name: MindSpeed NPU Tests
        comparison_name: PR / NPU

  - repo: triton-lang/triton-ascend
    comparison_group: triton-ascend
    workflows:
      # This PR workflow calls the reusable "Integration Tests NPU" workflow.
      - name: Integration Tests
        comparison_name: PR / NPU integration

  - repo: tile-ai/tilelang-mlir-ascend
    comparison_group: tilelang-mlir-ascend
    workflows:
      # Base CI is the current PR entrypoint for the Ascend/NPU-IR checks.
      - name: Base CI
        comparison_name: PR / Ascend NPU-IR

  - repo: modelscope/ms-swift
    comparison_group: ms-swift-ascend
    workflows:
      - name: citest-npu
        comparison_name: PR / NPU

  - repo: hiyouga/LLaMA-Factory
    comparison_group: llamafactory-ascend
    workflows:
      - name: tests_npu
        comparison_name: PR / NPU
